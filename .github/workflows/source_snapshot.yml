name: Source Snapshot

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          zip -r "meika-vox-source-${GITHUB_SHA}.zip" . \
            -x ".git/*" \
            -x "meika_vox_output/*" \
            -x "__pycache__/*" \
            -x "*.pyc"
      - uses: actions/upload-artifact@v4
        with:
          name: meika-vox-source-${{ github.sha }}
          path: meika-vox-source-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 90
